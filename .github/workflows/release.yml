name: Umbrella Release

# NO NPM_TOKEN REQUIRED — Umbrella validates component releases only
# REQUIRED: GITHUB_TOKEN (automatically provided)
# Component repos (vstack-playbook, vstack-opencode) require their own NPM_TOKEN secrets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Integrated release version (e.g., vstack-2026.11.02)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  validate-release:
    name: Validate Integrated Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate all
        run: pnpm run validate:all

      - name: Verify integrated release manifest
        run: |
          if [ -f "compatibility/integrated-release.json" ]; then
            cat compatibility/integrated-release.json | jq .
            # Verify release field matches
            RELEASE_ID=$(jq -r .release compatibility/integrated-release.json)
            if [ "${{ github.event.release.tag_name }}" != "$RELEASE_ID" ] && [ "${{ inputs.version }}" != "$RELEASE_ID" ]; then
              echo "WARNING: Release tag does not match integrated-release.json release field"
            fi
          else
            echo "ERROR: Missing compatibility/integrated-release.json"
            exit 1
          fi

      - name: Verify component references exist
        run: |
          # Check that component tags/commits can be resolved
          # This would require GitHub API calls in a real implementation
          echo "Component reference verification would run here"
          echo "In production, this would fetch tags from component repos"

  create-release-evidence:
    name: Create Release Evidence
    runs-on: ubuntu-latest
    needs: validate-release
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release evidence
        run: |
          mkdir -p release-evidence
          cat > release-evidence/integrated-release-${{ github.event.release.tag_name || inputs.version }}.json << 'EOF'
          {
            "release": "${{ github.event.release.tag_name || inputs.version }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "components": {
              "playbook": {
                "repository": "vipintom/vstack-playbook",
                "version": "$(jq -r .components.playbook.version compatibility/integrated-release.json)",
                "tag": "$(jq -r .components.playbook.tag compatibility/integrated-release.json)",
                "commit": "$(jq -r .components.playbook.commit compatibility/integrated-release.json)"
              },
              "opencode": {
                "repository": "vipintom/vstack-opencode",
                "version": "$(jq -r .components.opencode.version compatibility/integrated-release.json)",
                "tag": "$(jq -r .components.opencode.tag compatibility/integrated-release.json)",
                "commit": "$(jq -r .components.opencode.commit compatibility/integrated-release.json)"
              },
              "openchamber": {
                "repository": "vipintom/vstack-openchamber",
                "version": "$(jq -r .components.openchamber.version compatibility/integrated-release.json)",
                "tag": "$(jq -r .components.openchamber.tag compatibility/integrated-release.json)",
                "commit": "$(jq -r .components.openchamber.commit compatibility/integrated-release.json)"
              }
            },
            "protocol": {
              "version": "$(jq -r .protocol.version compatibility/integrated-release.json)"
            },
            "compatibility": {
              "status": "$(jq -r .compatibility.status compatibility/integrated-release.json)",
              "notes": "$(jq -r .compatibility.notes compatibility/integrated-release.json)"
            },
            "validation": {
              "contracts": "passed",
              "compatibility": "passed"
            }
          }
          EOF
          cat release-evidence/*.json

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release-evidence/

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true