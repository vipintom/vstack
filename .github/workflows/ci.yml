name: Docs CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Check local links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Wiki links
        run: node scripts/check-links.mjs wiki

      - name: Document links
        run: node scripts/check-links.mjs docs

  documentation-only:
    name: Enforce documentation-only scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No component directories
        run: |
          forbidden="website contracts compatibility node_modules wiki-playbook"
          for path in $forbidden; do
            if [ -e "$path" ]; then
              echo "ERROR: $path must not exist in the documentation home"
              exit 1
            fi
          done
          echo "OK: no component directories"

      - name: No runtime files
        run: |
          for file in package.json pnpm-lock.yaml opencode.jsonc skills-lock.json; do
            if [ -f "$file" ]; then
              echo "ERROR: $file must not exist in the documentation home"
              exit 1
            fi
          done
          echo "OK: no runtime files"

      - name: No 0.1.0 wiki pages
        run: |
          removed="Projections Roles Workflows Tools"
          for page in $removed; do
            if [ -f "wiki/$page.md" ]; then
              echo "ERROR: wiki/$page.md describes a component removed in 0.2.0"
              exit 1
            fi
          done
          echo "OK: no removed-component pages"
